  const KEY_STORE = 'digital-r.key';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = bytes => btoa(String.fromCharCode(...bytes));
  const salt = b64(DATA.salt), iv = b64(DATA.iv), ct = b64(DATA.ct), tag = b64(DATA.tag);
  const subtle = crypto.subtle;

  async function derive(password) {
    const base = await subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const bits = await subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: DATA.iterations }, base, 512);
    return new Uint8Array(bits);
  }

  // Returns the app's HTML, or null if the key is wrong.
  async function open(key) {
    const signed = new Uint8Array(iv.length + ct.length);
    signed.set(iv);
    signed.set(ct, iv.length);
    const macKey = await subtle.importKey('raw', key.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!(await subtle.verify('HMAC', macKey, tag, signed))) return null;
    const aesKey = await subtle.importKey('raw', key.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    return new TextDecoder().decode(await subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct));
  }

  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }

  const store = {
    get() { try { return localStorage.getItem(KEY_STORE); } catch { return null; } },
    set(v) { try { localStorage.setItem(KEY_STORE, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY_STORE); } catch {} },
  };

  const form = document.getElementById('f');
  const msg = document.getElementById('msg');
  const go = document.getElementById('go');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    go.disabled = true;
    msg.textContent = '';
    try {
      const key = await derive(document.getElementById('pw').value);
      const html = await open(key);
      if (!html) {
        msg.textContent = 'Wrong password';
        return;
      }
      if (document.getElementById('remember').checked) store.set(toB64(key));
      show(html);
    } finally {
      go.disabled = false;
    }
  });

  (async () => {
    const saved = store.get();
    if (saved) {
      try {
        const html = await open(b64(saved));
        if (html) return show(html);
      } catch {}
      store.clear(); // stale key from an older password
    }
    form.hidden = false;
    document.getElementById('pw').focus();
  })();
